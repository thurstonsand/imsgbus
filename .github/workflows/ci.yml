name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    # imsgbus builds with cgo for macOS, the only platform imsg runs on.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true
          cache: true

      - name: Bootstrap
        run: mise run bootstrap

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test

      - name: Build
        run: mise run build
