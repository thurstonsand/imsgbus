name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    # imsgbus builds with cgo for macOS, the only platform imsg runs on.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          minimum_release_age: 3d
          auto_update: true
          install: true
          cache: true

      - name: Bootstrap
        run: mise run bootstrap

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test

      - name: Build
        run: mise run build
